<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apple 官方韌體動態下載站</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen flex flex-col justify-between text-gray-800">

    <header class="bg-white border-b border-gray-200 py-4 shadow-sm sticky top-0 z-10">
        <div class="max-w-3xl mx-auto px-4 text-center">
            <h1 class="text-xl font-bold text-gray-900"> Apple 官方韌體動態下載站</h1>
            <p class="text-xs text-gray-500 mt-1">資料來源：ipsw.me API (即時動態抓取)</p>
        </div>
    </header>

    <main class="max-w-3xl w-full mx-auto p-4 md:p-6 my-auto mt-4 mb-auto">
        
        <!-- 步驟 1: 依分類群組的機型選單 -->
        <div class="bg-white p-4 rounded-2xl shadow-md mb-6">
            <label for="deviceSelect" class="block mb-1.5 font-semibold text-sm text-gray-700">1. 選擇產品與機型（已自動分類）：</label>
            <select id="deviceSelect" class="w-full p-3 border border-gray-300 rounded-xl bg-white text-base focus:ring-2 focus:ring-blue-500 focus:outline-none">
                <option value="">正在從 ipsw.me API 載入所有分類機型...</option>
            </select>
        </div>

        <!-- 步驟 2: 動態顯示該機型所有軟體版本與認證狀態 -->
        <div class="bg-white p-4 rounded-2xl shadow-md">
            <h2 class="font-semibold text-sm text-gray-700 mb-3">2. 該機型所有軟體版本與認證狀態 (動態清單)：</h2>
            <div id="firmwareList" class="space-y-3 max-h-[500px] overflow-y-auto pr-1">
                <p class="text-sm text-gray-400 text-center py-6">請先在上方選擇一個機型</p>
            </div>
        </div>

    </main>

    <footer class="text-center py-6 text-xs text-gray-400">
        &copy; 2026 韌體下載小工具
    </footer>

    <script>
        const deviceSelect = document.getElementById('deviceSelect');
        const firmwareList = document.getElementById('firmwareList');

        // 從官方 ipsw.me API 動態取得所有裝置並依分類群組 (optgroup)
        async function fetchDevices() {
            try {
                const response = await fetch('https://api.ipsw.me/v4/devices');
                const devices = await response.json();
                
                deviceSelect.innerHTML = '<option value="">-- 請選擇產品與機型 --</option>';

                // 依照 api 回傳的 type 進行分類 (例如 iPhone, iPad, Watch, AppleTV 等)
                const grouped = {};
                devices.forEach(device => {
                    const type = device.type ? device.type.toUpperCase() : 'OTHER';
                    if (!grouped[type]) grouped[type] = [];
                    grouped[type].push(device);
                });

                // 產生分類群組選項
                for (const [type, list] of Object.entries(grouped)) {
                    const optgroup = document.createElement('optgroup');
                    optgroup.label = `--- ${type} ---`;

                    list.forEach(device => {
                        const option = document.createElement('option');
                        option.value = device.identifier;
                        option.textContent = `${device.name} (${device.identifier})`;
                        optgroup.appendChild(option);
                    });

                    deviceSelect.appendChild(optgroup);
                }
            } catch (error) {
                deviceSelect.innerHTML = '<option value="">載入失敗，請檢查網路</option>';
            }
        }

        // 當選擇某個機型時，即時動態從 API 取得該機型的所有軟體版本與認證狀態
        deviceSelect.addEventListener('change', async function() {
            const identifier = this.value;
            firmwareList.innerHTML = '<p class="text-sm text-gray-500 text-center py-6">正在向 ipsw.me 查詢動態資料...</p>';

            if (!identifier) {
                firmwareList.innerHTML = '<p class="text-sm text-gray-400 text-center py-6">請先在上方選擇一個機型</p>';
                return;
            }

            try {
                const response = await fetch(`https://api.ipsw.me/v4/device/${identifier}?type=ipsw`);
                const data = await response.json();
                
                if (!data.firmwares || data.firmwares.length === 0) {
                    firmwareList.innerHTML = '<p class="text-sm text-red-500 text-center py-6">此機型目前查無韌體資料</p>';
                    return;
                }

                firmwareList.innerHTML = '';

                // 動態列出所有軟體版本與認證標籤
                data.firmwares.forEach(fw => {
                    const isSigned = fw.signed;
                    const statusBadge = isSigned 
                        ? '<span class="bg-green-100 text-green-700 text-xs px-2.5 py-1 rounded-full font-medium inline-flex items-center">🟢 認證中 (Signed)</span>' 
                        : '<span class="bg-red-100 text-red-600 text-xs px-2.5 py-1 rounded-full font-medium inline-flex items-center">🔴 已關閉 (Unsigned)</span>';
                    
                    const fileSizeGB = (fw.filesize / (1024 * 1024 * 1024)).toFixed(2);

                    const card = document.createElement('div');
                    card.className = "flex flex-col sm:flex-row sm:items-center justify-between p-3.5 border border-gray-200 rounded-xl hover:bg-gray-50 transition gap-3";
                    
                    card.innerHTML = `
                        <div>
                            <div class="flex items-center gap-2 flex-wrap mb-1">
                                <span class="font-bold text-gray-800 text-base">iOS / 軟體 ${fw.version}</span>
                                <span class="text-xs text-gray-500">(Build: ${fw.buildid})</span>
                                ${statusBadge}
                            </div>
                            <div class="text-xs text-gray-500">
                                檔案大小：${fileSizeGB} GB ｜ 發布日期：${fw.releasedate || '未知'}
                            </div>
                        </div>
                        <a href="${fw.url}" target="_blank" class="bg-blue-600 hover:bg-blue-700 text-white text-sm font-semibold px-4 py-2 rounded-lg text-center transition shadow-sm">
                            直接下載
                        </a>
                    `;

                    firmwareList.appendChild(card);
                });

            } catch (error) {
                firmwareList.innerHTML = '<p class="text-sm text-red-500 text-center py-6">無法取得軟體資料，請稍後再試</p>';
            }
        });

        fetchDevices();
    </script>
</body>
</html>
