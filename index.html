<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apple 官方韌體快速下載器</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen flex flex-col justify-between text-gray-800">

    <header class="bg-white border-b border-gray-200 py-4 shadow-sm">
        <div class="max-w-xl mx-auto px-4 text-center">
            <h1 class="text-xl font-bold text-gray-900"> Apple 官方韌體直接下載</h1>
            <p class="text-xs text-gray-500 mt-1">資料來源：ipsw.me API</p>
        </div>
    </header>

    <main class="max-w-xl w-full mx-auto p-6 bg-white rounded-2xl shadow-md my-auto mt-8 mb-auto">
        <div class="mb-5">
            <label for="deviceSelect" class="block mb-2 font-semibold text-sm text-gray-700">1. 選擇產品與型號：</label>
            <select id="deviceSelect" class="w-full p-3 border border-gray-300 rounded-xl bg-white text-base focus:ring-2 focus:ring-blue-500 focus:outline-none">
                <option value="">載入裝置列表中...</option>
            </select>
        </div>

        <div class="mb-5">
            <label for="firmwareSelect" class="block mb-2 font-semibold text-sm text-gray-700">2. 選擇系統版本 (IPSW)：</label>
            <select id="firmwareSelect" disabled class="w-full p-3 border border-gray-300 rounded-xl bg-gray-50 text-base focus:ring-2 focus:ring-blue-500 focus:outline-none disabled:bg-gray-100 disabled:text-gray-400">
                <option value="">請先選擇上方型號</option>
            </select>
        </div>

        <div id="info" class="mb-4 text-sm text-center text-gray-600 min-h-[24px]"></div>

        <button id="downloadBtn" disabled class="w-full p-3.5 rounded-xl font-semibold text-white bg-blue-600 hover:bg-blue-700 transition duration-200 shadow-md disabled:bg-gray-200 disabled:text-gray-400 disabled:cursor-not-allowed disabled:shadow-none">
            立即下載韌體
        </button>
    </main>

    <footer class="text-center py-6 text-xs text-gray-400">
        &copy; 2026 韌體下載小工具
    </footer>

    <script>
        const deviceSelect = document.getElementById('deviceSelect');
        const firmwareSelect = document.getElementById('firmwareSelect');
        const downloadBtn = document.getElementById('downloadBtn');
        const infoDiv = document.getElementById('info');

        let selectedDownloadUrl = '';

        async function fetchDevices() {
            try {
                const response = await fetch('https://api.ipsw.me/v4/devices');
                const devices = await response.json();
                deviceSelect.innerHTML = '<option value="">-- 請選擇您的裝置 --</option>';
                devices.forEach(device => {
                    const option = document.createElement('option');
                    option.value = device.identifier;
                    option.textContent = `${device.name} (${device.identifier})`;
                    deviceSelect.appendChild(option);
                });
            } catch (error) {
                deviceSelect.innerHTML = '<option value="">載入失敗，請重新整理</option>';
            }
        }

        deviceSelect.addEventListener('change', async function() {
            const identifier = this.value;
            firmwareSelect.innerHTML = '<option value="">載入版本中...</option>';
            firmwareSelect.disabled = true;
            downloadBtn.disabled = true;
            infoDiv.textContent = '';

            if (!identifier) return;

            try {
                const response = await fetch(`https://api.ipsw.me/v4/device/${identifier}?type=ipsw`);
                const data = await response.json();
                firmwareSelect.innerHTML = '<option value="">-- 請選擇系統版本 --</option>';
                window.currentFirmwares = data.firmwares;

                data.firmwares.forEach((fw, index) => {
                    const option = document.createElement('option');
                    option.value = index;
                    let statusText = fw.signed ? '🟢 認證中 (Signed)' : '🔴 已關閉 (Unsigned)';
                    option.textContent = `iOS ${fw.version} (Build: ${fw.buildid}) - ${statusText}`;
                    firmwareSelect.appendChild(option);
                });

                firmwareSelect.disabled = false;
                firmwareSelect.classList.remove('bg-gray-50', 'text-gray-400');
            } catch (error) {
                firmwareSelect.innerHTML = '<option value="">無法取得韌體資料</option>';
            }
        });

        firmwareSelect.addEventListener('change', function() {
            const index = this.value;
            if (index === '') {
                downloadBtn.disabled = true;
                selectedDownloadUrl = '';
                infoDiv.textContent = '';
                return;
            }

            const fw = window.currentFirmwares[index];
            selectedDownloadUrl = fw.url;
            downloadBtn.disabled = false;

            if (!fw.signed) {
                infoDiv.innerHTML = '⚠️ <span class="text-amber-600 font-medium">注意：此版本 Apple 已關閉認證，下載後無法正常刷入。</span>';
            } else {
                infoDiv.innerHTML = `檔案大小： <span class="font-semibold text-gray-700">${(fw.filesize / (1024*1024*1024)).toFixed(2)} GB</span>`;
            }
        });

        downloadBtn.addEventListener('click', function() {
            if (selectedDownloadUrl) {
                window.location.href = selectedDownloadUrl;
            }
        });

        fetchDevices();
    </script>
</body>
</html>
